<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Every Train UK · Live trains in Great Britain</title>
  <meta name="apple-mobile-web-app-title" content="Every Train UK">
  <meta name="application-name" content="Every Train UK">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161b26" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Live map of trains on the Great Britain rail network and London's TfL lines.">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1 class="sr-only">Every Train UK</h1>
  <div id="map" aria-label="Map of trains"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <!-- Search: top left on a computer, across the top on a phone. -->
  <div class="topbar">
    <div id="search" class="search" role="search">
      <img class="logo" src="/logo.svg" alt="" width="26" height="26">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Zm0 1.6a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8Zm4.9 8.2 3.5 3.5-1.1 1.1-3.5-3.5 1.1-1.1Z"/></svg>
      <input id="search-input" type="search" placeholder="Search trains and stations" autocomplete="off" spellcheck="false" enterkeyhint="search"
        role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" aria-label="Search trains and stations">
      <kbd class="kbd" aria-hidden="true">/</kbd>
      <button id="search-clear" class="icon-btn sm" type="button" aria-label="Clear search" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8"/></svg>
      </button>
    </div>
    <div id="search-pop" class="pop search-pop" hidden>
      <ul id="search-results" class="results" role="listbox" aria-label="Matching trains"></ul>
    </div>
  </div>

  <button id="layers-btn" class="fab layers-btn" type="button" aria-expanded="false" aria-controls="layers" title="Networks, lines and map options">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5 2.5 6.5 10 10.5l7.5-4z"/><path d="M2.5 10 10 14l7.5-4M2.5 13.5 10 17.5l7.5-4"/></svg>
    <span class="fab-label">Layers</span><span id="layers-count" class="count" hidden></span>
  </button>
  <div id="layers" class="pop layers" role="dialog" aria-label="Layers" hidden></div>

  <!-- Live status and the colour key, bottom left. -->
  <div id="key" class="key" aria-label="Trains on the map"></div>
  <div id="chooser" class="pop chooser" role="dialog" aria-label="Trains here" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- The selected train, or trains near you: a card on a computer, a bottom sheet on a phone. -->
  <aside id="sheet" class="sheet" hidden>
    <div id="sheet-grip" class="sheet-grip" role="button" tabindex="-1" aria-label="Show more"></div>
    <div id="sheet-body" class="sheet-body">
      <section id="detail" class="detail" aria-label="Selected train" hidden>
        <div class="peek">
          <div class="d-head">
            <div id="d-title" class="d-title"></div>
            <button id="d-close" class="icon-btn" type="button" title="Close (Esc)" aria-label="Close">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
            </button>
          </div>
          <div id="d-route" class="d-route"></div>
          <div id="d-meta" class="d-meta"></div>
          <div id="d-next" class="d-next only-narrow"></div>
          <div id="d-extra" class="d-extra"></div>
          <div class="d-actions">
            <button id="d-follow" class="btn" type="button" aria-pressed="false">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="5.5"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3"/></svg>Follow
            </button>
            <button id="d-fit" class="btn" type="button" title="Zoom out to the whole journey">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5V3h4.5M12.5 3H17v4.5M17 12.5V17h-4.5M7.5 17H3v-4.5"/></svg>Full route
            </button>
            <button id="d-peers" class="btn" type="button" aria-pressed="false">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M1.5 10h17"/><circle cx="5" cy="10" r="2" fill="currentColor"/><circle cx="10.5" cy="10" r="2" fill="currentColor"/><circle cx="16" cy="10" r="2" fill="currentColor"/></svg><span id="d-peers-label">Same line</span>
            </button>
          </div>
        </div>
        <section id="d-peers-list" class="peers" aria-label="Trains on the same line" hidden></section>
        <div id="d-note" class="d-note"></div>
        <ol id="d-calls" class="calls" aria-label="Stops"></ol>
        <button id="d-more" class="link-btn more" type="button" hidden></button>
      </section>

      <section id="nearby" class="nearby" aria-label="Trains near you" hidden>
        <div class="peek">
          <div class="n-head">
            <h2>Near you</h2>
            <span id="n-sub" class="n-sub"></span>
            <button id="n-close" class="icon-btn" type="button" title="Stop showing my location" aria-label="Stop showing my location">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
            </button>
          </div>
        </div>
        <ul id="n-list" class="n-list"></ul>
      </section>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/app.js"></script>
</body>
</html>
